
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>برنامج تقييم المحل</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1, h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #4285f4;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #3367d6;
        }

        .question {
            margin-top: 20px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
        }

        .stars {
            text-align: center;
            direction: ltr;
            margin-top: 10px;
        }

        .star {
            font-size: 35px;
            cursor: pointer;
            color: #ccc;
            margin: 3px;
        }

        .star.active {
            color: gold;
        }

        #ratingPage,
        #qrPage {
            display: none;
        }

        #message {
            text-align: center;
            font-size: 18px;
            margin-top: 15px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- الصفحة الرئيسية -->
    <div id="homePage">

        <h1>⭐ برنامج تقييم المحل</h1>

        <p>اكتب اسم المحل:</p>

        <input
            type="text"
            id="shopName"
            placeholder="اسم المحل">

        <button onclick="startRating()">
            ابدأ التقييم
        </button>

        <button onclick="showQR()">
            📱 إنشاء QR
        </button>

        <div id="message"></div>

    </div>


    <!-- صفحة التقييم -->
    <div id="ratingPage">

        <h2>⭐ تقييم المحل</h2>

        <h3 id="shopTitle"></h3>

        <div class="question">
            <p>1️⃣ كيف كان التعامل؟</p>

            <div class="stars" data-question="1">
                <span class="star" onclick="rate(1,1)">★</span>
                <span class="star" onclick="rate(1,2)">★</span>
                <span class="star" onclick="rate(1,3)">★</span>
                <span class="star" onclick="rate(1,4)">★</span>
                <span class="star" onclick="rate(1,5)">★</span>
            </div>
        </div>


        <div class="question">
            <p>2️⃣ ما رأيك في الأسعار؟</p>

            <div class="stars" data-question="2">
                <span class="star" onclick="rate(2,1)">★</span>
                <span class="star" onclick="rate(2,2)">★</span>
                <span class="star" onclick="rate(2,3)">★</span>
                <span class="star" onclick="rate(2,4)">★</span>
                <span class="star" onclick="rate(2,5)">★</span>
            </div>
        </div>


        <div class="question">
            <p>3️⃣ ما رأيك في جودة الخدمة؟</p>

            <div class="stars" data-question="3">
                <span class="star" onclick="rate(3,1)">★</span>
                <span class="star" onclick="rate(3,2)">★</span>
                <span class="star" onclick="rate(3,3)">★</span>
                <span class="star" onclick="rate(3,4)">★</span>
                <span class="star" onclick="rate(3,5)">★</span>
            </div>
        </div>


        <div class="question">
            <p>4️⃣ ما رأيك في سرعة الخدمة؟</p>

            <div class="stars" data-question="4">
                <span class="star" onclick="rate(4,1)">★</span>
                <span class="star" onclick="rate(4,2)">★</span>
                <span class="star" onclick="rate(4,3)">★</span>
                <span class="star" onclick="rate(4,4)">★</span>
                <span class="star" onclick="rate(4,5)">★</span>
            </div>
        </div>


        <div class="question">
            <p>5️⃣ هل تنصح الآخرين بالمحل؟</p>

            <div class="stars" data-question="5">
                <span class="star" onclick="rate(5,1)">★</span>
                <span class="star" onclick="rate(5,2)">★</span>
                <span class="star" onclick="rate(5,3)">★</span>
                <span class="star" onclick="rate(5,4)">★</span>
                <span class="star" onclick="rate(5,5)">★</span>
            </div>
        </div>


        <button onclick="saveRating()">
            ✅ إرسال التقييم
        </button>

        <button onclick="goHome()">
            ↩️ رجوع
        </button>

        <div id="ratingMessage"></div>

    </div>


    <!-- صفحة QR -->
    <div id="qrPage">

        <h2>📱 QR Code</h2>

        <p style="text-align:center;">
            امسح الكود لفتح صفحة التقييم
        </p>

        <div id="qrcode"></div>

        <button onclick="goHome()">
            ↩️ رجوع
        </button>

    </div>

</div>


<!-- مكتبة QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

    let currentShop = "";
    let ratings = [0, 0, 0, 0, 0];


    function startRating() {

        let shop = document.getElementById("shopName").value.trim();

        if (shop === "") {

            document.getElementById("message").innerText =
                "⚠️ اكتب اسم المحل أولاً";

            return;
        }

        currentShop = shop;

        document.getElementById("homePage").style.display = "none";
        document.getElementById("ratingPage").style.display = "block";

        document.getElementById("shopTitle").innerText =
            "المحل: " + currentShop;

        ratings = [0, 0, 0, 0, 0];

        resetStars();
    }


    function rate(question, value) {

        ratings[question - 1] = value;

        let box = document.querySelector(
            '[data-question="' + question + '"]'
        );

        let stars = box.querySelectorAll(".star");

        stars.forEach(function(star, index) {

            if (index < value) {
                star.classList.add("active");
            } else {
                star.classList.remove("active");
            }

        });
    }


    function saveRating() {

        for (let i = 0; i < ratings.length; i++) {

            if (ratings[i] === 0) {

                document.getElementById("ratingMessage").innerText =
                    "⚠️ لازم تجاوب على كل الأسئلة";

                return;
            }
        }


        let key = "ratings_" + currentShop;

        let oldRatings =
            JSON.parse(localStorage.getItem(key)) || [];


        oldRatings.push({
            answers: ratings,
            date: new Date().toLocaleString("ar-EG")
        });


        localStorage.setItem(
            key,
            JSON.stringify(oldRatings)
        );


        document.getElementById("ratingMessage").innerText =
            "✅ تم حفظ التقييم بنجاح";

        setTimeout(function() {

            goHome();

        }, 1500);
    }


    function resetStars() {

        document.querySelectorAll(".star").forEach(function(star) {

            star.classList.remove("active");

        });
    }


    function goHome() {

        document.getElementById("ratingPage").style.display = "none";
        document.getElementById("qrPage").style.display = "none";
        document.getElementById("homePage").style.display = "block";

        document.getElementById("ratingMessage").innerText = "";

    }


    function showQR() {

        document.getElementById("homePage").style.display = "none";
        document.getElementById("qrPage").style.display = "block";

        document.getElementById("qrcode").innerHTML = "";

        new QRCode(
            document.getElementById("qrcode"),
            {
                text: window.location.href,
                width: 250,
                height: 250
            }
        );
    }

</script>

</body>
</html>
